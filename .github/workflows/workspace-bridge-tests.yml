name: workspace-bridge tests

on:
  push:
    branches: [main]
    paths:
      - 'plugins/workspace-bridge/**'
      - '.github/workflows/workspace-bridge-tests.yml'
  pull_request:
    paths:
      - 'plugins/workspace-bridge/**'
      - '.github/workflows/workspace-bridge-tests.yml'

permissions:
  contents: read

jobs:
  server:
    name: server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: plugins/workspace-bridge/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: plugins/workspace-bridge/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run deploy:dry
