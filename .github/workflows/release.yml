name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens/updates a release PR per plugin from conventional commits, and on
      # merge tags it as <plugin>@vX.Y.Z and bumps that plugin's plugin.json.
      # Each plugin under plugins/ versions independently.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # After a release lands, make sure marketplace.json carries the new
      # version. release-please bumps plugin.json; this propagates it.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.releases_created }}
        with:
          node-version: 20

      - name: Sync marketplace entry versions
        if: ${{ steps.release.outputs.releases_created }}
        run: node scripts/sync-plugins.mjs

      - name: Commit the sync if anything changed
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sync marketplace versions after release"
            git push
          else
            echo "already in sync"
          fi
