name: Leak check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Scan tracked files for private names
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
        run: node scripts/leak-check.mjs
